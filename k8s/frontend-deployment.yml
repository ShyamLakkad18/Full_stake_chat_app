kind: Deployment
apiVersion: apps/v1
metadata:
  name: frontend-deployment
  namespace: nginx
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      name: frontend-pod
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: shyam8080/frontend:v6
        ports:
          - containerPort: 80
        env:
        - name: NODE_ENV
          value: production
